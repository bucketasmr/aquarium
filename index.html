<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор Аквариума (Магазин со значками)</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            image-rendering: pixelated;
        }
        body {
            margin: 0;
            padding: 0;
            background: #111827;
            color: #f3f4f6;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: manipulation;
        }
        h1 {
            margin: 10px 0;
            font-size: 1.8rem;
            color: #38bdf8;
            text-shadow: 2px 2px #0369a1;
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 900px;
            max-width: 100%;
            padding: 15px;
            background: #1f2937;
            border: 4px solid #374151;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 8px;
            transition: max-width 0.3s ease;
        }
        
        .container.pc-mode {
            max-width: 1450px !important;
            display: grid;
            grid-template-columns: 310px 864px 310px;
            grid-template-rows: auto auto auto auto auto;
            justify-content: center;
            align-items: start;
            gap: 15px;
        }
        .container.pc-mode h1 {
            grid-column: 1 / -1;
        }
        .container.pc-mode .top-panel {
            grid-column: 1 / -1;
        }
        .container.pc-mode canvas {
            grid-column: 2;
            grid-row: 3;
            width: 864px !important;
            height: 450px !important;
        }
        .container.pc-mode .controls {
            grid-column: 2;
            grid-row: 4;
        }
        .container.pc-mode .panels-box {
            display: contents;
        }
        .container.pc-mode .left-sidebar {
            grid-column: 1;
            grid-row: 3 / span 2;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .container.pc-mode .right-sidebar {
            grid-column: 3;
            grid-row: 3 / span 2;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .container.pc-mode .bottom-full {
            grid-column: 1 / -1;
        }

        .top-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111827;
            padding: 10px 15px;
            border: 2px solid #374151;
            border-radius: 6px;
            font-size: 1.1rem;
            flex-wrap: wrap;
            gap: 10px;
        }
        .stat-group {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .stat-item span {
            color: #facc15;
            font-weight: bold;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            background: #0284c7;
            border: 4px solid #0f172a;
            border-radius: 4px;
            cursor: pointer;
            touch-action: manipulation;
        }

        canvas:fullscreen {
            width: 100vw !important;
            height: 100vh !important;
            aspect-ratio: auto;
            object-fit: contain;
            border: none;
            border-radius: 0;
            background: #020617;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background: #2563eb;
            color: white;
            border: 2px solid #1d4ed8;
            padding: 10px 16px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 4px 0 #1e40af;
            transition: all 0.1s ease;
            touch-action: manipulation;
        }
        button:hover {
            background: #3b82f6;
        }
        button:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1e40af;
        }
        button:disabled {
            background: #374151 !important;
            border-color: #4b5563 !important;
            box-shadow: 0 4px 0 #1f2937 !important;
            color: #9ca3af !important;
            cursor: not-allowed;
            transform: none;
            opacity: 0.65;
        }
        button.success {
            background: #16a34a;
            border-color: #15803d;
            box-shadow: 0 4px 0 #166534;
        }
        button.success:hover {
            background: #22c55e;
        }
        button.warning {
            background: #d97706;
            border-color: #b45309;
            box-shadow: 0 4px 0 #92400e;
        }
        button.warning:hover {
            background: #f59e0b;
        }
        button.purple {
            background: #9333ea;
            border-color: #7e22ce;
            box-shadow: 0 4px 0 #6b21a8;
        }
        button.purple:hover {
            background: #a855f7;
        }
        button.dark-mode {
            background: #475569;
            border-color: #334155;
            box-shadow: 0 4px 0 #1e293b;
        }
        button.dark-mode:hover {
            background: #64748b;
        }
        button.cyan {
            background: #0891b2;
            border-color: #0e7490;
            box-shadow: 0 4px 0 #155e75;
        }
        button.cyan:hover {
            background: #06b6d4;
        }
        .panels-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 768px) {
            .panels-box {
                grid-template-columns: 1fr;
            }
        }
        .panel {
            background: #111827;
            border: 2px solid #374151;
            border-radius: 6px;
            padding: 12px;
        }
        .panel h3 {
            margin-top: 0;
            color: #38bdf8;
            font-size: 1.1rem;
            border-bottom: 2px solid #374151;
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .shop-list, .inventory-list, .quest-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 240px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .shop-item, .inv-item, .quest-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f2937;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #374151;
            font-size: 0.85rem;
        }
        .inv-item-details {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            margin-right: 12px;
        }
        .stats-row {
            display: flex;
            gap: 12px;
            font-size: 0.78rem;
            color: #9ca3af;
            flex-wrap: wrap;
            align-items: center;
        }
        .stat-bar-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
        }

        .bar-container {
            position: relative;
            width: 80px;
            height: 14px;
            background: #0f172a;
            border: 2px solid #d97706;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8), 0 0 2px rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
        }
        .bar-fill-wrapper {
            height: 100%;
            width: 100%;
            position: relative;
            transition: width 0.3s ease;
        }
        .bar-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.45), rgba(255,255,255,0.05));
            pointer-events: none;
        }
        .bar-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 14px,
                rgba(0, 0, 0, 0.4) 14px,
                rgba(0, 0, 0, 0.4) 16px
            );
            z-index: 2;
            pointer-events: none;
        }

        .bar-red {
            background: linear-gradient(to bottom, #f87171 0%, #ef4444 50%, #991b1b 100%);
            box-shadow: 0 0 6px rgba(239, 68, 68, 0.6);
        }
        .bar-green {
            background: linear-gradient(to bottom, #4ade80 0%, #22c55e 50%, #14532d 100%);
            box-shadow: 0 0 6px rgba(34, 197, 94, 0.6);
        }
        .bar-yellow {
            background: linear-gradient(to bottom, #fde047 0%, #eab308 50%, #713f12 100%);
            box-shadow: 0 0 6px rgba(234, 179, 8, 0.6);
        }

        .shop-item button, .inv-item button, .quest-item button {
            padding: 4px 8px;
            font-size: 0.8rem;
            box-shadow: 0 2px 0 #1e40af;
            touch-action: manipulation;
        }
        .bulk-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .bulk-actions button {
            flex: 1;
            font-size: 0.8rem;
            padding: 6px 10px;
        }
        .info-text {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <h1>Симулятор Аквариума</h1>
        
        <div class="top-panel">
            <div class="stat-group">
                <div class="stat-item">Монеты: <span id="coinsVal">150</span> 🪙</div>
                <div class="stat-item">Рыбки: <span id="fishCountVal">0</span>/<span id="maxFishVal">4</span> 🐠</div>
                <div class="stat-item">Чистота: <span id="cleanVal">100</span>% 💧</div>
            </div>
            <div class="stat-group">
                <div class="stat-item" id="timeOfDayLabel">Время: День ☀️</div>
                <div class="stat-item">Кормление: <span id="feedTimerVal">Готово!</span> ⏳</div>
            </div>
        </div>

        <div class="left-sidebar" id="leftSidebar" style="display: none;">
            <div class="panel">
                <h3>Задания</h3>
                <div class="quest-list" id="questList"></div>
            </div>
        </div>

        <canvas id="aquariumCanvas" width="864" height="450"></canvas>

        <div class="right-sidebar" id="rightSidebar" style="display: none;">
            <div class="panel">
                <h3>Магазин <span style="font-size: 0.95rem; color: #facc15;" id="shopCoinsVal">150 🪙</span></h3>
                <div class="shop-list" id="shopList"></div>
            </div>
        </div>

        <div class="controls">
            <button id="feedBtn" class="success" onclick="feedFish()">Покормить (2р/день)</button>
            <button id="cleanBtn" class="warning" onclick="cleanWater()">Почистить воду (20 🪙)</button>
            <button id="fullCleanBtn" class="warning" style="background:#b45309; border-color:#92400e;" onclick="fullCleanWater()">Полная очистка (35 🪙)</button>
            <button id="filterBtn" onclick="toggleFilter()">Фильтр: ВЫКЛ</button>
            <button id="styleBtn" class="cyan" onclick="toggleFishStyle()">Стиль рыб: Пиксельный</button>
            <button class="cyan" onclick="toggleCanvasFullScreen()">На весь экран ⛶</button>
            <button class="purple" onclick="setPcMode(true)" id="pcModeBtn">Режим ПК</button>
            <button class="dark-mode" onclick="setPcMode(false)" id="stdModeBtn">Стандартный режим</button>
            <button class="purple" onclick="saveGameManual()">Сохранить</button>
            <button class="purple" onclick="loadGameManual()">Загрузить</button>
        </div>

        <div class="panels-box" id="standardPanels">
            <div class="panel">
                <h3>Задания</h3>
                <div class="quest-list" id="questListMobile"></div>
            </div>
            <div class="panel">
                <h3>Магазин <span style="font-size: 0.95rem; color: #facc15;" id="shopCoinsValMobile">150 🪙</span></h3>
                <div class="shop-list" id="shopListMobile"></div>
            </div>
        </div>

        <div class="panel bottom-full">
            <h3>Список рыб и рынок</h3>
            <div class="bulk-actions">
                <button class="warning" onclick="sellBulkAquariumFish(5)">Продать 5 из аквариума</button>
                <button class="warning" onclick="sellBulkAquariumFish(10)">Продать 10 из аквариума</button>
                <button class="warning" onclick="sellBulkAquariumFish(9999)">Продать всех из акв.</button>
                <button class="success" onclick="sellBulkMarketFish(9999)">Продать всех на рынок</button>
            </div>
            <div class="inventory-list" id="inventoryList"></div>
            <div class="info-text">✨ В магазин добавлены иконки для каждой позиции!</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('aquariumCanvas');
        const ctx = canvas.getContext('2d');

        const SAVE_KEY = 'pixel_aquarium_save_master_v3';

        let gameData = {
            coins: 150,
            maxFishCapacity: 4,
            waterCleanliness: 100,
            filterOn: false,
            lightOn: false,
            pcMode: false,
            realisticStyle: false,
            showFishBars: true,
            lastFeedTime: 0,
            fishes: [],
            decorations: [],
            inventory: [],
            foods: [],
            poops: [],
            fishBubbles: [],
            sandDusts: [],
            matingParticles: [],
            treasures: [],
            chestTimer: 0,
            quests: {
                poopCollected: 0,
                bubblesPopped: 0,
                treasuresCollected: 0,
                coinsEarnedGoal: 0
            }
        };

        let mouseX = -9999;
        let mouseY = -9999;
        let wasDarkLastFrame = false;

        const SHOP_ITEMS = [
            { id: 'guppy', name: 'Гуппи (Быстрые стайные)', type: 'fish', price: 25, color: '#eab308', adultTimeDays: 1, nocturnal: false, icon: '🐠' },
            { id: 'goldfish', name: 'Малек Золотой рыбки (Крупная)', type: 'fish', price: 50, color: '#f97316', adultTimeDays: 7, nocturnal: false, icon: '🐠' },
            { id: 'neon', name: 'Малек Неона (Яркий косяк)', type: 'fish', price: 30, color: '#06b6d4', adultTimeDays: 7, nocturnal: false, icon: '🐠' },
            { id: 'corydoras', name: 'Сомик Коридорас (Ночной санитар)', type: 'fish', price: 45, color: '#a3e635', adultTimeDays: 5, nocturnal: true, icon: '🐠' },
            { id: 'beta', name: 'Малек Петушка (Элегантный)', type: 'fish', price: 80, color: '#ec4899', adultTimeDays: 7, nocturnal: false, icon: '🐠' },
            { id: 'expand', name: 'Расширение аквариума (+2 места)', type: 'upgrade', price: 80, icon: '📐' },
            { id: 'castle', name: 'Замок', type: 'decor', price: 150, icon: '🏰' },
            { id: 'plant', name: 'Водоросли', type: 'decor', price: 40, icon: '🌿' }
        ];

        function initGame() {
            loadGameData();

            if (!gameData.fishes || gameData.fishes.length === 0) {
                gameData.fishes.push(createFish('guppy', '#eab308', 1, false));
                gameData.fishes.push(createFish('corydoras', '#a3e635', 5, true));
            }

            gameData.decorations = (gameData.decorations || []).filter(d => d.type !== 'chest');
            gameData.decorations.push({ type: 'chest', x: 720, y: 410 });

            if (!gameData.decorations.some(d => d.type === 'plant')) {
                gameData.decorations.push({ type: 'plant', x: 80, y: 410, scaleY: 1.0 });
                gameData.decorations.push({ type: 'plant', x: 220, y: 410, scaleY: 1.0 });
            }

            gameData.decorations.forEach(d => {
                if (d.type === 'plant' && d.scaleY === undefined) d.scaleY = 1.0;
            });

            applyPcModeUI();
            updateStyleButtonUI();
            renderShop();
            renderInventory();
            renderQuests();
            updateUI();

            canvas.addEventListener('pointerdown', handleCanvasClick);
            canvas.addEventListener('pointermove', handlePointerMove);
            canvas.addEventListener('pointerleave', () => { mouseX = -9999; mouseY = -9999; });
        }

        function saveGame() {
            localStorage.setItem(SAVE_KEY, JSON.stringify(gameData));
        }

        function loadGameData() {
            let saved = localStorage.getItem(SAVE_KEY);

            if (!saved) {
                for (let i = 9; i >= 1; i--) {
                    const oldSave = localStorage.getItem(`pixel_aquarium_save_v${i}`) || localStorage.getItem('pixel_aquarium_save_master');
                    if (oldSave) {
                        saved = oldSave;
                        break;
                    }
                }
            }

            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    gameData = { ...gameData, ...parsed };
                    if (!gameData.foods) gameData.foods = [];
                    if (!gameData.matingParticles) gameData.matingParticles = [];
                    if (!gameData.fishes) gameData.fishes = [];
                    if (!gameData.inventory) gameData.inventory = [];
                    if (!gameData.quests) {
                        gameData.quests = { poopCollected: 0, bubblesPopped: 0, treasuresCollected: 0, coinsEarnedGoal: 0 };
                    }
                    if (gameData.showFishBars === undefined) gameData.showFishBars = true;
                    
                    gameData.fishes.forEach(f => {
                        if (f.tailAnimPhase === undefined) f.tailAnimPhase = Math.random() * Math.PI * 2;
                        if (f.health === undefined) f.health = Math.floor(Math.random() * 21) + 80;
                        if (f.fullness === undefined) f.fullness = 0;
                        if (f.happiness === undefined) f.happiness = 100;
                        if (f.nocturnal === undefined) f.nocturnal = f.type === 'corydoras';
                    });
                    saveGame();
                } catch (e) {
                    console.error('Ошибка загрузки сохранения', e);
                }
            }
        }

        function setPcMode(enabled) {
            gameData.pcMode = enabled;
            applyPcModeUI();
            saveGame();
        }

        function toggleFishStyle() {
            gameData.realisticStyle = !gameData.realisticStyle;
            updateStyleButtonUI();
            saveGame();
        }

        function updateStyleButtonUI() {
            const btn = document.getElementById('styleBtn');
            if (gameData.realisticStyle) {
                btn.innerText = 'Стиль рыб: Реалистичный';
                btn.style.background = '#16a34a';
                btn.style.borderColor = '#15803d';
            } else {
                btn.innerText = 'Стиль рыб: Пиксельный';
                btn.style.background = '#0891b2';
                btn.style.borderColor = '#0e7490';
            }
        }

        function toggleCanvasFullScreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement) {
                if (canvas.requestFullscreen) {
                    canvas.requestFullscreen();
                } else if (canvas.webkitRequestFullscreen) {
                    canvas.webkitRequestFullscreen();
                } else if (canvas.mozRequestFullScreen) {
                    canvas.mozRequestFullScreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                }
            }
        }

        function applyPcModeUI() {
            const container = document.getElementById('mainContainer');
            const pcBtn = document.getElementById('pcModeBtn');
            const stdBtn = document.getElementById('stdModeBtn');
            const standardPanels = document.getElementById('standardPanels');
            const leftSidebar = document.getElementById('leftSidebar');
            const rightSidebar = document.getElementById('rightSidebar');

            if (gameData.pcMode) {
                container.classList.add('pc-mode');
                pcBtn.style.background = '#16a34a';
                pcBtn.style.borderColor = '#15803d';
                stdBtn.style.background = '#475569';
                stdBtn.style.borderColor = '#334155';
                standardPanels.style.display = 'none';
                leftSidebar.style.display = 'flex';
                rightSidebar.style.display = 'flex';
            } else {
                container.classList.remove('pc-mode');
                pcBtn.style.background = '#9333ea';
                pcBtn.style.borderColor = '#7e22ce';
                stdBtn.style.background = '#16a34a';
                stdBtn.style.borderColor = '#15803d';
                standardPanels.style.display = 'grid';
                leftSidebar.style.display = 'none';
                rightSidebar.style.display = 'none';
            }
        }

        function saveGameManual() {
            saveGame();
            alert('Игра успешно сохранена!');
        }

        function loadGameManual() {
            loadGameData();
            updateStyleButtonUI();
            renderShop();
            renderInventory();
            renderQuests();
            updateUI();
            alert('Игра успешно загружена!');
        }

        function createFish(type, color, adultDays = 7, nocturnal = false) {
            const minMs = 5 * 60 * 1000;
            const maxMs = 15 * 60 * 1000;
            const randomPoopInterval = Math.floor(Math.random() * (maxMs - minMs + 1)) + minMs;

            let preferredY = 200;
            if (type === 'neon' || type === 'guppy') preferredY = 80 + Math.random() * 150;
            if (type === 'goldfish') preferredY = 180 + Math.random() * 160;
            if (type === 'corydoras') preferredY = 360 + Math.random() * 30;
            if (type === 'beta') preferredY = 120 + Math.random() * 200;

            return {
                id: Math.random().toString(36).substr(2, 9),
                type: type,
                color: color,
                nocturnal: nocturnal,
                x: Math.random() * (canvas.width - 120) + 60,
                y: preferredY,
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.2,
                targetX: Math.random() * (canvas.width - 120) + 60,
                targetY: preferredY,
                angle: 0,
                facingLeft: false,
                zRotationTimer: Math.floor(Math.random() * 500) + 300,
                zMode: 0,
                zProgress: 0,
                state: 'swim',
                stateTimer: Math.floor(Math.random() * 400) + 200,
                inspectPauseTimer: 0,
                scaredTimer: 0,
                birthTime: Date.now(),
                adultDays: adultDays,
                sizeFactor: 1.0,
                lastPoopTime: Date.now(),
                nextPoopInterval: randomPoopInterval,
                tailAnimPhase: Math.random() * Math.PI * 2,
                health: Math.floor(Math.random() * 21) + 80,
                fullness: 0,
                happiness: 100
            };
        }

        function getCanvasCoordinates(event) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            let clientX = event.clientX;
            let clientY = event.clientY;

            if (event.touches && event.touches.length > 0) {
                clientX = event.touches[0].clientX;
                clientY = event.touches[0].clientY;
            }

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function handlePointerMove(event) {
            const coords = getCanvasCoordinates(event);
            mouseX = coords.x;
            mouseY = coords.y;
        }

        function triggerNightLightPanic() {
            gameData.fishes.forEach(fish => {
                if (!fish.nocturnal) {
                    fish.scaredTimer = 180;
                    fish.state = 'dash';
                    fish.targetX = Math.random() * (canvas.width - 120) + 60;
                    fish.targetY = Math.random() * 250 + 60;
                }
            });
        }

        function handleCanvasClick(event) {
            const coords = getCanvasCoordinates(event);
            const clickX = coords.x;
            const clickY = coords.y;

            if (clickX >= 10 && clickX <= 180 && clickY >= 5 && clickY <= 30) {
                gameData.showFishBars = !gameData.showFishBars;
                saveGame();
                updateUI();
                return;
            }

            if (clickX >= canvas.width / 2 - 60 && clickX <= canvas.width / 2 + 60 && clickY >= 0 && clickY <= 35) {
                const timeData = getTimeOfDay();
                const wasDark = timeData.dark && !gameData.lightOn;
                
                gameData.lightOn = !gameData.lightOn;

                if (wasDark && gameData.lightOn) {
                    triggerNightLightPanic();
                }

                saveGame();
                updateUI();
                return;
            }

            if (clickX >= 770 && clickX <= 815 && clickY >= 335 && clickY <= 410) {
                toggleFilter();
                return;
            }

            let collected = false;

            gameData.treasures = gameData.treasures.filter(t => {
                const dist = Math.hypot(t.x - clickX, t.y - clickY);
                if (dist < 22) {
                    gameData.coins += 15;
                    gameData.quests.treasuresCollected++;
                    gameData.quests.coinsEarnedGoal += 15;
                    collected = true;
                    renderQuests();
                    return false;
                }
                return true;
            });

            gameData.poops = gameData.poops.filter(p => {
                const dist = Math.hypot(p.x - clickX, p.y - clickY);
                if (dist < 22) {
                    gameData.coins += 3;
                    gameData.quests.poopCollected++;
                    gameData.quests.coinsEarnedGoal += 3;
                    collected = true;
                    renderQuests();
                    return false;
                }
                return true;
            });

            gameData.fishBubbles = gameData.fishBubbles.filter(b => {
                const dist = Math.hypot(b.x - clickX, b.y - clickY);
                if (dist < 22) {
                    gameData.coins += 1;
                    gameData.quests.bubblesPopped++;
                    gameData.quests.coinsEarnedGoal += 1;
                    collected = true;
                    renderQuests();
                    return false;
                }
                return true;
            });

            if (collected) {
                saveGame();
                updateUI();
                renderShop();
                return;
            }

            spawnFood(clickX, clickY);
            triggerScare(clickX, clickY, 180);
        }

        function spawnFood(x, y) {
            gameData.foods.push({
                x: x,
                y: y,
                targetY: 410,
                falling: true,
                spawnTime: Date.now()
            });
            saveGame();
            updateUI();
        }

        function triggerScare(x, y, radius) {
            gameData.fishes.forEach(fish => {
                const dist = Math.hypot(fish.x - x, fish.y - y);
                if (dist < radius) {
                    const angle = Math.atan2(fish.y - y, fish.x - x);
                    const escapeDist = 200 + Math.random() * 100;
                    
                    fish.targetX = Math.max(60, Math.min(canvas.width - 60, fish.x + Math.cos(angle) * escapeDist));
                    fish.targetY = Math.max(50, Math.min(380, fish.y + Math.sin(angle) * escapeDist));
                    
                    fish.state = 'dash';
                    fish.inspectPauseTimer = 0;
                    fish.scaredTimer = 80;
                    fish.stateTimer = 200;
                    fish.zMode = 0;
                }
            });
        }

        const FEED_INTERVAL = 12 * 60 * 60 * 1000;

        function feedFish() {
            const now = Date.now();
            const elapsed = now - gameData.lastFeedTime;
            if (gameData.lastFeedTime > 0 && elapsed < FEED_INTERVAL) return;

            gameData.lastFeedTime = now;
            feedFishRandom();
            gameData.waterCleanliness = Math.max(0, gameData.waterCleanliness - 5);
            saveGame();
            updateUI();
        }

        function feedFishRandom() {
            spawnFood(Math.random() * (canvas.width - 100) + 50, 40 + Math.random() * 50);
        }

            if (gameData.coins < 20) {

                return;
            }
            gameData.coins -= 20;
            gameData.waterCleanliness = 100;
            saveGame();
            updateUI();
            renderShop();
        }

        function fullCleanWater() {
            if (gameData.coins < 35) {
                alert('Недостаточно монет! Требуется 35 🪙');
                return;
            }
            gameData.coins -= 35;
            gameData.waterCleanliness = 100;
            gameData.poops = [];

        function buyItem(itemId) {
            const item = SHOP_ITEMS.find(i => i.id === itemId);
            if (!item || gameData.coins < item.price) {
                alert('Недостаточно монет!');
                return;
            }

            if (item.type === 'fish') {
                if (gameData.fishes.length >= gameData.maxFishCapacity) {
                    alert('Аквариум полон! Купите расширение в магазине.');
                    return;
                }
                gameData.coins -= item.price;
                gameData.fishes.push(createFish(item.id, item.color, item.adultTimeDays || 7, item.nocturnal || false));
            } else if (item.type === 'upgrade') {
                gameData.coins -= item.price;
                gameData.maxFishCapacity += 2;
            } else if (item.type === 'decor') {
                gameData.coins -= item.price;
                gameData.decorations.push({
                    type: item.id,
                    x: Math.random() * (canvas.width - 160) + 80,
                    y: 410,
                    scaleY: item.id === 'plant' ? 1.0 : undefined
                });
            }

            saveGame();
            renderInventory();
            renderShop();
            updateUI();
        }

        function sellFishFromAquarium(fishId) {
            const index = gameData.fishes.findIndex(f => f.id === fishId);
            if (index !== -1) {
                const fish = gameData.fishes[index];
                const ageDays = (Date.now() - fish.birthTime) / (1000 * 60 * 60 * 24);
                const adultDays = fish.adultDays || 7;
                const percent = Math.min(1, ageDays / adultDays);

                let maxReward = 60;
                if (fish.type === 'guppy') maxReward = 35;
                if (fish.type === 'beta') maxReward = 100;
                if (fish.type === 'neon') maxReward = 40;
                if (fish.type === 'corydoras') maxReward = 55;

                const healthFactor = (fish.health || 100) / 100;
                const reward = Math.max(5, Math.round(maxReward * 0.7 * percent * healthFactor));

                gameData.coins += reward;
                gameData.quests.coinsEarnedGoal += reward;
                gameData.fishes.splice(index, 1);
                saveGame();
                renderInventory();
                renderShop();
                updateUI();
            }
        }

                if (fish.type === 'guppy') reward = 35;
                if (fish.type === 'beta') reward = 100;

                gameData.quests.coinsEarnedGoal += reward;
                gameData.inventory.splice(index, 1);

            if (gameData.fishes.length === 0) {
                alert('В аквариуме нет рыб!');
                return;
            }

            let soldCount = 0;
            while (gameData.fishes.length > 0 && soldCount < count) {
                const fish = gameData.fishes.shift();
                const ageDays = (Date.now() - fish.birthTime) / (1000 * 60 * 60 * 24);
                const adultDays = fish.adultDays || 7;
                const percent = Math.min(1, ageDays / adultDays);

                let maxReward = 60;
                if (fish.type === 'guppy') maxReward = 35;
                if (fish.type === 'beta') maxReward = 100;
                if (fish.type === 'neon') maxReward = 40;
                if (fish.type === 'corydoras') maxReward = 55;

                const healthFactor = (fish.health || 100) / 100;
                const reward = Math.max(5, Math.round(maxReward * 0.7 * percent * healthFactor));
                gameData.coins += reward;
                gameData.quests.coinsEarnedGoal += reward;
                soldCount++;
            }

            saveGame();
            renderInventory();
            renderShop();
            updateUI();
        }

        function sellBulkMarketFish(count) {
            if (gameData.inventory.length === 0) {
                alert('Нет готовых рыб на рынке!');
                return;
            }

            let soldCount = 0;
            while (gameData.inventory.length > 0 && soldCount < count) {
                const fish = gameData.inventory.pop();
                let reward = 60;
                if (fish.type === 'guppy') reward = 35;
                if (fish.type === 'beta') reward = 100;
                if (fish.type === 'neon') reward = 40;
                if (fish.type === 'corydoras') reward = 55;

                gameData.coins += reward;
                gameData.quests.coinsEarnedGoal += reward;
                soldCount++;
            }

            saveGame();
            renderInventory();
            renderShop();
            updateUI();
        }

            document.getElementById('coinsVal').innerText = gameData.coins;
            const sValMob = document.getElementById('shopCoinsValMobile');
            const sVal = document.getElementById('shopCoinsVal');
            if (sVal) sVal.innerText = gameData.coins + ' 🪙';
            if (sValMob) sValMob.innerText = gameData.coins + ' 🪙';

            document.getElementById('fishCountVal').innerText = gameData.fishes.length;
            document.getElementById('maxFishVal').innerText = gameData.maxFishCapacity;
            document.getElementById('cleanVal').innerText = Math.round(gameData.waterCleanliness);

            if (gameData.filterOn) {
                filterBtn.innerText = 'Фильтр: ВКЛ';
                filterBtn.style.background = '#16a34a';
                filterBtn.style.borderColor = '#15803d';
            } else {

                filterBtn.style.background = '#2563eb';

            const elapsed = now - gameData.lastFeedTime;

                const hours = Math.floor(left / (1000 * 60 * 60));

                feedTimerVal.innerText = `${hours}ч ${mins}м`;
                feedBtn.disabled = true;

        function getTimeOfDay() {
            const hour = new Date().getHours();
            
            if (hour >= 6 && hour < 12) return { mode: 'morning', name: 'Утро 🌅', top: '#7dd3fc', bot: '#0284c7', dark: false };
            if (hour >= 12 && hour < 18) return { mode: 'day', name: 'День ☀️', top: '#38bdf8', bot: '#0369a1', dark: false };
            if (hour >= 18 && hour < 21) return { mode: 'evening', name: 'Вечер 🌇', top: '#c084fc', bot: '#1e3a8a', dark: true };
            return { mode: 'night', name: 'Ночь 🌙', top: '#1e1b4b', bot: '#0f172a', dark: true };
        }

        function updateFish() {
            const now = Date.now();
            const toMoveToInventory = [];

            const timeData = getTimeOfDay();
            const isDarkTime = timeData.dark && !gameData.lightOn;

            if (wasDarkLastFrame && !isDarkTime) {
                triggerNightLightPanic();
            }
            wasDarkLastFrame = isDarkTime;

            const chest = gameData.decorations.find(d => d.type === 'chest');
            if (chest && !isDarkTime) {
                gameData.chestTimer++;
                if (gameData.chestTimer > 1800) {
                    gameData.treasures.push({
                        x: chest.x + (Math.random() - 0.5) * 16,
                        y: 395
                    });
                    gameData.chestTimer = 0;
                }
            }

            gameData.decorations.forEach(dec => {
                if (dec.type === 'plant') {
                    if (dec.scaleY === undefined) dec.scaleY = 1.0;
                    if (dec.scaleY < 1.0) {
                        dec.scaleY += 0.0001;
                    }
                }
            });

            const FOOD_MAX_AGE = 30 * 60 * 1000;
            gameData.foods = gameData.foods.filter(f => {
                if (f.spawnTime && now - f.spawnTime >= FOOD_MAX_AGE) {
                    return false;
                }
                if (f.falling) {
                    f.y += 0.12;
                    let hitGround = f.y >= f.targetY;
                    if (!hitGround) {
                        for (let other of gameData.foods) {
                            if (!other.falling && Math.abs(other.x - f.x) < 8 && Math.abs(other.y - f.y) < 6) {
                                hitGround = true;
                                f.targetY = other.y - 4;
                                break;
                            }
                        }
                    }
                    if (hitGround || f.y >= f.targetY) {
                        f.y = f.targetY;
                        f.falling = false;
                    }
                }
                return true;
            });

            if (mouseX !== -9999 && mouseY !== -9999) {
                gameData.fishes.forEach(fish => {
                    const distToMouse = Math.hypot(fish.x - mouseX, fish.y - mouseY);
                    if (distToMouse < 100) {
                        const angle = Math.atan2(fish.y - mouseY, fish.x - mouseX);
                        fish.targetX = Math.max(60, Math.min(canvas.width - 60, fish.x + Math.cos(angle) * 150));
                        fish.targetY = Math.max(50, Math.min(380, fish.y + Math.sin(angle) * 150));
                        fish.state = 'dash';
                        fish.scaredTimer = 80;
                    }
                });
            }

            const FULLNESS_DECAY_PER_FRAME = 100 / (72 * 3600 * 60);

            gameData.fishes = gameData.fishes.filter((fish) => {
                const adultMs = (fish.adultDays || 7) * 24 * 60 * 60 * 1000;
                const age = now - fish.birthTime;
                const progress = Math.min(1, age / adultMs);
                fish.sizeFactor = 1.0 + progress * 1.2;

                if (progress >= 1) {
                    toMoveToInventory.push(fish);
                    return false;
                }

                fish.fullness = Math.max(0, fish.fullness - FULLNESS_DECAY_PER_FRAME);
                if (fish.fullness <= 0) {
                    fish.health = Math.max(0, fish.health - FULLNESS_DECAY_PER_FRAME * 2.5);
                } else if (fish.fullness > 50 && fish.health < 100) {
                    fish.health = Math.min(100, fish.health + FULLNESS_DECAY_PER_FRAME * 1.2);
                }

                if (fish.health <= 0) {
                    return false;
                }

                let targetHappiness = (fish.health + fish.fullness + gameData.waterCleanliness) / 3;
                fish.happiness += (targetHappiness - fish.happiness) * 0.01;

                const foodNoticeRadius = (timeData.mode === 'morning') ? 35 * fish.sizeFactor : 20 * fish.sizeFactor;

                if (fish.fullness < 95 && gameData.foods.length > 0) {
                    let closestFoodIdx = -1;
                    let minDist = 9999;
                    gameData.foods.forEach((food, fIdx) => {
                        const d = Math.hypot(food.x - fish.x, food.y - fish.y);
                        if (d < minDist) {
                            minDist = d;
                            closestFoodIdx = fIdx;
                        }
                    });

                    if (closestFoodIdx !== -1) {
                        const food = gameData.foods[closestFoodIdx];
                        if (minDist < foodNoticeRadius) {
                            gameData.foods.splice(closestFoodIdx, 1);
                            fish.fullness = Math.min(100, fish.fullness + 35);
                            fish.happiness = Math.min(100, fish.happiness + 15);
                        } else if (fish.scaredTimer === 0 && (!isDarkTime || fish.nocturnal)) {
                            fish.targetX = food.x;
                            fish.targetY = food.falling ? food.y : 380;
                            fish.state = 'swim';
                        }
                    }
                }

                if (isDarkTime && !fish.nocturnal) {
                    if (!fish.sleepPoopPausedAt) {
                        fish.sleepPoopPausedAt = now;
                    }
                } else {
                    if (fish.sleepPoopPausedAt) {
                        const sleepDuration = now - fish.sleepPoopPausedAt;
                        fish.lastPoopTime += sleepDuration;
                        fish.sleepPoopPausedAt = null;
                    }

                    if (now - fish.lastPoopTime >= fish.nextPoopInterval) {
                        gameData.poops.push({
                            x: fish.x,
                            y: fish.y,
                            targetY: 428 + Math.random() * 4,
                            falling: true
                        });
                        fish.lastPoopTime = now;
                        const minMs = 5 * 60 * 1000;
                        const maxMs = 15 * 60 * 1000;
                        fish.nextPoopInterval = Math.floor(Math.random() * (maxMs - minMs + 1)) + minMs;
                    }
                }

                if (!isDarkTime && Math.random() < 0.0006 && Math.abs(fish.zProgress) <= 0.3) {
                    const mouthX = fish.facingLeft ? fish.x - 14 * fish.sizeFactor : fish.x + 14 * fish.sizeFactor;
                    gameData.fishBubbles.push({
                        x: mouthX,
                        y: fish.y,
                        speed: 0.6 + Math.random() * 0.4
                    });
                }

                fish.zRotationTimer--;
                if (fish.zRotationTimer <= 0) {
                    fish.zRotationTimer = Math.floor(Math.random() * 500) + 300;
                    const randChoice = Math.random();
                    if (randChoice < 0.15) fish.zMode = 1;
                    else if (randChoice < 0.3) fish.zMode = -1;
                    else fish.zMode = 0;
                }

                const targetZProgress = fish.zMode;
                fish.zProgress += (targetZProgress - fish.zProgress) * 0.04;

                if (fish.scaredTimer > 0) {
                    fish.scaredTimer--;
                } else if (fish.inspectPauseTimer > 0) {
                    fish.inspectPauseTimer--;
                    fish.vx *= 0.9;
                    fish.vy *= 0.9;
                    
                    if (fish.state === 'dig' && Math.random() < 0.3) {
                        gameData.sandDusts.push({
                            x: fish.x + (Math.random() - 0.5) * 16,
                            y: 395,
                            vy: -(0.3 + Math.random() * 0.4),
                            alpha: 0.8
                        });
                    }

                    if (fish.inspectPauseTimer === 0) {
                        fish.state = 'swim';
                    }
                } else {
                    fish.stateTimer--;
                    if (fish.stateTimer <= 0) {
                        const rand = Math.random();

                        if (isDarkTime && !fish.nocturnal) {
                            fish.state = 'sleep';
                            fish.targetX = fish.x + (Math.random() - 0.5) * 20;
                            fish.targetY = 350 + Math.random() * 35;
                            fish.stateTimer = Math.floor(Math.random() * 800) + 500;
                        } else if (timeData.mode === 'morning' && rand < 0.35) {
                            const partner = gameData.fishes.find(other => other !== fish && other.type === fish.type);
                            if (partner) {
                                fish.state = 'mate';
                                fish.targetX = partner.x + (Math.random() - 0.5) * 40;
                                fish.targetY = partner.y + (Math.random() - 0.5) * 20;
                                fish.stateTimer = Math.floor(Math.random() * 300) + 150;
                                
                                if (Math.random() < 0.5) {
                                    gameData.matingParticles.push({
                                        x: (fish.x + partner.x) / 2,
                                        y: (fish.y + partner.y) / 2,
                                        alpha: 1.0
                                    });
                                }
                            } else {
                                fish.state = 'swim';
                                fish.targetX = Math.random() * (canvas.width - 120) + 60;
                                fish.targetY = Math.random() * 280 + 50;
                                fish.stateTimer = 250;
                            }
                        } else if (timeData.mode === 'day' && rand < 0.3) {
                            const plants = gameData.decorations.filter(d => d.type === 'plant' || d.type === 'castle');
                            if (plants.length > 0) {
                                fish.state = 'hide';
                                const targetPlant = plants[Math.floor(Math.random() * plants.length)];
                                fish.targetX = targetPlant.x + (Math.random() - 0.5) * 30;
                                fish.targetY = 360;
                                fish.stateTimer = Math.floor(Math.random() * 400) + 200;
                            } else {
                                fish.state = 'swim';
                                fish.targetX = Math.random() * (canvas.width - 120) + 60;
                                fish.targetY = Math.random() * 250 + 60;
                                fish.stateTimer = 300;
                            }
                        } else if (timeData.mode === 'evening' && !fish.nocturnal && rand < 0.5) {
                            fish.state = 'rest';
                            fish.targetX = fish.x + (Math.random() - 0.5) * 30;
                            fish.targetY = 320 + Math.random() * 50;
                            fish.stateTimer = Math.floor(Math.random() * 400) + 200;
                        } else if (rand < 0.45) {
                            fish.state = 'swim';
                            fish.targetX = Math.random() * (canvas.width - 120) + 60;
                            
                            let yRangeMin = 50, yRangeMax = 320;
                            if (fish.type === 'neon' || fish.type === 'guppy') { yRangeMin = 50; yRangeMax = 200; }
                            if (fish.type === 'goldfish') { yRangeMin = 180; yRangeMax = 370; }
                            if (fish.type === 'corydoras') { yRangeMin = 340; yRangeMax = 390; }

                            fish.targetY = Math.random() * (yRangeMax - yRangeMin) + yRangeMin;
                            fish.stateTimer = Math.floor(Math.random() * 400) + 200;
                        } else if (rand < 0.65) {
                            fish.state = 'rest';
                            fish.targetX = fish.x + (Math.random() - 0.5) * 40;
                            fish.targetY = fish.y + (Math.random() - 0.5) * 20;
                            fish.stateTimer = Math.floor(Math.random() * 250) + 120;
                        } else if (rand < 0.8) {
                            fish.state = 'dig';
                            fish.targetX = Math.random() * (canvas.width - 120) + 60;
                            fish.targetY = 380;
                            fish.stateTimer = Math.floor(Math.random() * 200) + 150;
                        } else {
                            fish.state = 'swim';
                            fish.targetX = Math.random() * (canvas.width - 120) + 60;
                            fish.targetY = Math.random() * 300 + 50;
                            fish.stateTimer = 300;
                        }
                    }

                    if (fish.state === 'inspect' || fish.state === 'dig' || fish.state === 'filter' || fish.state === 'hide') {
                        const distToTarget = Math.hypot(fish.targetX - fish.x, fish.targetY - fish.y);
                        if (distToTarget < 25 && fish.inspectPauseTimer === 0) {
                            fish.inspectPauseTimer = Math.floor(Math.random() * 150) + 80;
                        }
                    }
                }

                let baseSpeed = 0.35;
                if (fish.type === 'guppy') baseSpeed = 0.45;
                if (fish.type === 'neon') baseSpeed = 0.55;
                if (fish.type === 'goldfish') baseSpeed = 0.28;
                if (fish.type === 'beta') baseSpeed = 0.35;
                if (fish.type === 'corydoras') baseSpeed = 0.40;

                if (timeData.mode === 'morning') baseSpeed *= 1.3;
                if (timeData.mode === 'evening' && !fish.nocturnal) baseSpeed *= 0.6;
                if (timeData.mode === 'evening' && fish.nocturnal) baseSpeed *= 1.4;
                if (isDarkTime && fish.nocturnal) baseSpeed *= 1.5;
                if (isDarkTime && !fish.nocturnal) baseSpeed *= 0.08;

                if (fish.state === 'rest' || fish.state === 'sleep' || fish.state === 'hide') baseSpeed *= 0.1;
                if (fish.state === 'dash' || fish.scaredTimer > 0) baseSpeed *= 2.2;
                if (fish.inspectPauseTimer > 0) baseSpeed = 0.0;

                let targetX = fish.targetX;
                let targetY = fish.targetY;

                if (fish.scaredTimer === 0 && fish.inspectPauseTimer === 0 && fish.state !== 'inspect' && fish.state !== 'dig') {
                    let separateX = 0, separateY = 0;

                    gameData.fishes.forEach(other => {
                        if (other !== fish) {
                            const d = Math.hypot(other.x - fish.x, other.y - fish.y);
                            const personalSpace = 80 * Math.max(fish.sizeFactor, other.sizeFactor);
                            if (d < personalSpace && d > 0) {
                                const pushAngle = Math.atan2(fish.y - other.y, fish.x - other.x);
                                const force = (personalSpace - d) / personalSpace;
                                separateX += Math.cos(pushAngle) * force * 2.0;
                                separateY += Math.sin(pushAngle) * force * 1.5;
                            }
                        }
                    });

                    targetX += separateX * 15;
                    targetY += separateY * 15;
                }

                const dx = targetX - fish.x;
                const dy = targetY - fish.y;
                const dist = Math.hypot(dx, dy);

                if (dist > 2) {
                    let targetVx = (dx / dist) * baseSpeed;
                    let targetVy = (dy / dist) * baseSpeed;
                    
                    if (Math.abs(fish.zProgress) > 0.4) {
                        targetVx *= 0.1;
                        targetVy *= 1.3;
                    }

                    fish.vx += (targetVx - fish.vx) * 0.08;
                    fish.vy += (targetVy - fish.vy) * 0.08;
                } else {
                    fish.vx *= 0.85;
                    fish.vy *= 0.85;
                }

                fish.x += fish.vx;
                fish.y += fish.vy;

                if (fish.x < 50) { fish.x = 50; fish.targetX = fish.x + 120; }
                if (fish.x > canvas.width - 50) { fish.x = canvas.width - 50; fish.targetX = fish.x - 120; }
                if (fish.y < 45) { fish.y = 45; fish.targetY = fish.y + 100; }
                if (fish.y > 390) { fish.y = 390; fish.targetY = fish.y - 40; }

                if (Math.abs(fish.vx) > 0.015) {
                    if (fish.vx < -0.005) fish.facingLeft = true;
                    else if (fish.vx > 0.005) fish.facingLeft = false;
                }

                let targetAngle = Math.max(-0.45, Math.min(0.45, fish.vy * 0.35));
                if (fish.state === 'dig' && fish.inspectPauseTimer > 0) {
                    targetAngle = 0.55;
                }
                fish.angle += (targetAngle - fish.angle) * 0.15;

                return true;
            });

            gameData.matingParticles.forEach(mp => {
                mp.alpha -= 0.015;
            });
            gameData.matingParticles = gameData.matingParticles.filter(mp => mp.alpha > 0);

            gameData.sandDusts.forEach(sd => {
                sd.y += sd.vy;
                sd.alpha -= 0.015;
            });
            gameData.sandDusts = gameData.sandDusts.filter(sd => sd.alpha > 0);

            gameData.poops.forEach(p => {
                if (p.falling) {
                    p.y += 0.4;
                    if (p.y >= p.targetY) {
                        p.y = p.targetY;
                        p.falling = false;
                    }
                }
            });

            gameData.fishBubbles.forEach(b => {
                b.y -= b.speed;
            });
            gameData.fishBubbles = gameData.fishBubbles.filter(b => b.y > 40);

            if (toMoveToInventory.length > 0) {
                toMoveToInventory.forEach(grownFish => {
                    gameData.inventory.push(grownFish);
                });
                renderInventory();
            }

            const pollutionRate = gameData.filterOn ? 0.0003 : 0.0012;
            gameData.waterCleanliness = Math.max(0, gameData.waterCleanliness - pollutionRate);
        }

        let bubbleAnimCounter = 0;

        function drawAquarium() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const timeData = getTimeOfDay();
            document.getElementById('timeOfDayLabel').innerText = `Время: ${timeData.name} ${gameData.lightOn ? '(Свет ВКЛ)' : ''}`;

            const cleanliness = gameData.waterCleanliness;
            let topColor = timeData.top;
            let botColor = timeData.bot;

            if (gameData.lightOn && timeData.dark) {
                topColor = '#38bdf8';
                botColor = '#0284c7';
            }

            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, topColor);
            gradient.addColorStop(1, botColor);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (cleanliness < 85) {
                const greenFactor = Math.min(0.7, (85 - cleanliness) / 85 * 0.7);
                ctx.fillStyle = `rgba(34, 197, 94, ${greenFactor})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            gameData.treasures.forEach(t => {
                ctx.fillStyle = '#facc15';
                ctx.beginPath();
                ctx.arc(t.x, t.y, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ca8a04';
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            gameData.decorations.forEach(dec => {
                drawDecoration(dec.type, dec.x, canvas.height - 40, dec.scaleY || 1.0);
            });

            ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
            ctx.beginPath();
            ctx.moveTo(150, 0); ctx.lineTo(250, 0); ctx.lineTo(180, canvas.height); ctx.lineTo(80, canvas.height);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(500, 0); ctx.lineTo(620, 0); ctx.lineTo(550, canvas.height); ctx.lineTo(430, canvas.height);
            ctx.fill();

            ctx.fillStyle = '#d97706';
            ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
            ctx.fillStyle = '#b45309';
            ctx.fillRect(0, canvas.height - 40, canvas.width, 6);

            const centerX = canvas.width / 2;
            ctx.fillStyle = '#334155';
            ctx.fillRect(centerX - 40, 0, 80, 12);
            ctx.fillStyle = '#64748b';
            ctx.fillRect(centerX - 15, 12, 30, 8);

            ctx.fillStyle = gameData.lightOn ? '#facc15' : '#475569';
            ctx.beginPath();
            ctx.moveTo(centerX - 35, 20);
            ctx.lineTo(centerX + 35, 20);
            ctx.lineTo(centerX + 20, 32);
            ctx.lineTo(centerX - 20, 32);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = gameData.showFishBars ? '#16a34a' : '#374151';
            ctx.strokeStyle = '#d97706';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(10, 8, 170, 24, 4);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 11px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText(gameData.showFishBars ? 'Показатели: ВКЛ 📊' : 'Показатели: ВЫКЛ 📊', 95, 24);

            if (gameData.lightOn) {
                const lightGrad = ctx.createRadialGradient(centerX, 25, 10, centerX, 150, 350);
                lightGrad.addColorStop(0, 'rgba(255, 250, 200, 0.35)');
                lightGrad.addColorStop(1, 'rgba(255, 250, 200, 0)');
                ctx.fillStyle = lightGrad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            ctx.fillStyle = '#475569';
            ctx.fillRect(780, canvas.height - 75, 35, 35);
            ctx.fillStyle = gameData.filterOn ? '#22c55e' : '#334155';
            ctx.fillRect(792, canvas.height - 65, 12, 12);
            ctx.fillStyle = '#64748b';
            ctx.fillRect(795, canvas.height - 95, 6, 25);

            if (gameData.filterOn) {
                bubbleAnimCounter += 0.02;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
                const pipeTopY = canvas.height - 95;
                for (let i = 0; i < 6; i++) {
                    const bx = 798 + Math.sin(bubbleAnimCounter * 3 + i * 1.5) * 5;
                    const by = pipeTopY - ((bubbleAnimCounter * 70 + i * 40) % (pipeTopY - 30));
                    ctx.fillRect(bx, by, 4, 4);
                }
            }

            gameData.foods.forEach(f => {
                ctx.fillStyle = '#b45309';
                ctx.fillRect(f.x - 3, f.y - 3, 6, 6);
                ctx.fillStyle = '#f59e0b';
                ctx.fillRect(f.x - 1, f.y - 1, 2, 2);
            });

            gameData.poops.forEach(p => {
                ctx.fillStyle = '#582f0e';
                ctx.fillRect(p.x - 3, p.y, 6, 4);
                ctx.fillRect(p.x - 1, p.y - 2, 3, 2);
            });

            gameData.sandDusts.forEach(sd => {
                ctx.fillStyle = `rgba(217, 119, 6, ${sd.alpha})`;
                ctx.fillRect(sd.x, sd.y, 5, 4);
            });

            gameData.matingParticles.forEach(mp => {
                ctx.fillStyle = `rgba(253, 224, 71, ${mp.alpha})`;
                ctx.beginPath();
                ctx.arc(mp.x, mp.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            gameData.fishBubbles.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            const isDarkTime = timeData.dark && !gameData.lightOn;

            gameData.fishes.forEach(fish => {
                ctx.save();
                
                if (isDarkTime && !fish.nocturnal) {
                    ctx.globalAlpha = 0.55;
                }

                if (gameData.realisticStyle) {
                    drawRealisticFish(fish);
                } else {
                    drawPixelFish(fish);
                }

                ctx.restore();

                if (gameData.showFishBars) {
                    drawFloatingFishBars(fish);
                }
            });

            if (cleanliness < 85) {
                drawGlassMold(cleanliness);
            }
        }

        function drawFloatingFishBars(fish) {
            ctx.save();
            ctx.globalAlpha = 0.6;

            const barWidth = 36;
            const barHeight = 4;
            const offsetY = 24 * fish.sizeFactor;

            ctx.translate(fish.x, fish.y - offsetY);

            ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
            ctx.strokeStyle = '#d97706';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(-barWidth / 2 - 3, -16, barWidth + 6, 18, 3);
            ctx.fill();
            ctx.stroke();

            drawMiniBar(-barWidth / 2, -13, barWidth, barHeight, fish.health, '#ef4444', '#991b1b');
            drawMiniBar(-barWidth / 2, -8, barWidth, barHeight, fish.fullness, '#22c55e', '#14532d');
            drawMiniBar(-barWidth / 2, -3, barWidth, barHeight, fish.happiness, '#eab308', '#713f12');

            ctx.restore();
        }

        function drawMiniBar(x, y, w, h, percent, topColor, botColor) {
            percent = Math.max(0, Math.min(100, percent));
            const fillW = (w * percent) / 100;

            ctx.fillStyle = '#1e293b';
            ctx.fillRect(x, y, w, h);

            if (fillW > 0) {
                const grad = ctx.createLinearGradient(x, y, x, y + h);
                grad.addColorStop(0, topColor);
                grad.addColorStop(1, botColor);
                ctx.fillStyle = grad;
                ctx.fillRect(x, y, fillW, h);
            }

            ctx.strokeStyle = '#020617';
            ctx.lineWidth = 0.5;
            ctx.strokeRect(x, y, w, h);
        }

        function drawGlassMold(cleanliness) {
            const moldIntensity = Math.min(1.0, (85 - cleanliness) / 85);
            ctx.fillStyle = `rgba(16, 185, 129, ${0.15 + moldIntensity * 0.55})`;

            const thickness = 15 + moldIntensity * 25;
            ctx.fillRect(0, 0, thickness, canvas.height);
            ctx.fillRect(canvas.width - thickness, 0, thickness, canvas.height);
            ctx.fillRect(0, 0, canvas.width, thickness * 0.6);
            ctx.fillRect(0, canvas.height - 40 - thickness * 0.5, canvas.width, thickness * 0.5);

            ctx.fillStyle = `rgba(5, 150, 105, ${0.3 + moldIntensity * 0.4})`;
            for (let i = 20; i < canvas.height - 50; i += 35) {
                const sizeVar = (i % 7) * 4;
                ctx.fillRect(0, i, 22 + sizeVar, 12);
                ctx.fillRect(canvas.width - (22 + sizeVar), i + 15, 22 + sizeVar, 12);
            }
        }

        function drawDecoration(type, x, y, scaleY = 1.0) {
            ctx.save();
            ctx.translate(x, y);
            const time = Date.now() * 0.003;

            if (type === 'plant') {
                const swayTop1 = Math.sin(time) * 4 * scaleY;
                const swayTop2 = Math.cos(time * 0.8) * 5 * scaleY;

                ctx.fillStyle = '#15803d';
                ctx.beginPath();
                ctx.moveTo(-4, 0);
                ctx.lineTo(-4 + swayTop1, -55 * scaleY);
                ctx.lineTo(4 + swayTop1, -55 * scaleY);
                ctx.lineTo(4, 0);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#22c55e';
                ctx.beginPath();
                ctx.moveTo(-12, 0);
                ctx.lineTo(-12 + swayTop2, -45 * scaleY);
                ctx.lineTo(-4 + swayTop2, -45 * scaleY);
                ctx.lineTo(-4, 0);
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(4, 0);
                ctx.lineTo(4 + swayTop1 * 0.7, -35 * scaleY);
                ctx.lineTo(12 + swayTop1 * 0.7, -35 * scaleY);
                ctx.lineTo(12, 0);
                ctx.closePath();
                ctx.fill();
            } else if (type === 'chest') {
                ctx.fillStyle = '#78350f';
                ctx.fillRect(-20, -20, 40, 20);
                ctx.fillStyle = '#f59e0b';
                ctx.fillRect(-6, -14, 12, 8);
                const isOpen = gameData.chestTimer > 1500 || gameData.treasures.length > 0;
                if (isOpen) {
                    ctx.fillRect(-20, -28, 40, 4);
                } else {
                    ctx.fillRect(-20, -22, 40, 4);
                }
            } else if (type === 'castle') {
                ctx.fillStyle = '#64748b';
                ctx.fillRect(-30, -60, 60, 60);
                ctx.fillRect(-35, -70, 14, 12);
                ctx.fillRect(21, -70, 14, 12);
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(-10, -25, 20, 25);
            }
            ctx.restore();
        }

        function drawPixelFish(fish) {
            ctx.save();
            ctx.translate(fish.x, fish.y);
            ctx.rotate(fish.angle);

            const s = fish.sizeFactor;
            const z = fish.zProgress;

            if (fish.tailAnimPhase === undefined) fish.tailAnimPhase = 0;
            const isMoving = Math.abs(fish.vx) > 0.03 || Math.abs(fish.vy) > 0.03;
            if (isMoving) {
                fish.tailAnimPhase += 0.08;
            }
            const tailWag = isMoving ? Math.sin(fish.tailAnimPhase) * 4.5 : 0;

            if (Math.abs(z) > 0.3) {
                const widthScale = Math.max(0.35, 1.0 - Math.abs(z) * 0.65);
                ctx.scale(s * widthScale, s);

                ctx.fillStyle = fish.color;
                ctx.fillRect(-10, -7, 20, 14);

                if (z > 0) {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(-5, -3, 3, 3);
                    ctx.fillRect(2, -3, 3, 3);
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(-4, -2, 1, 1);
                    ctx.fillRect(3, -2, 1, 1);
                } else {
                    ctx.fillStyle = '#b45309';
                    ctx.fillRect(-12, -10, 24, 4);
                }
            } else {
                if (fish.facingLeft) {
                    ctx.scale(-s, s);
                } else {
                    ctx.scale(s, s);
                }

                if (fish.type === 'guppy') {
                    ctx.fillStyle = fish.color;
                    ctx.fillRect(-12, -6, 24, 12);
                    ctx.fillStyle = '#facc15';
                    ctx.fillRect(-16, -4, 8, 8);
                    ctx.beginPath();
                    ctx.moveTo(-12, 0);
                    ctx.lineTo(-22, -8 - tailWag);
                    ctx.lineTo(-22, 8 + tailWag);
                    ctx.closePath();
                    ctx.fill();
                } else if (fish.type === 'goldfish') {
                    ctx.fillStyle = fish.color;
                    ctx.fillRect(-16, -10, 30, 20);
                    ctx.fillRect(-8, -14, 16, 28);
                    ctx.fillStyle = '#fb923c';
                    ctx.beginPath();
                    ctx.moveTo(-16, 0);
                    ctx.lineTo(-28, -12 - tailWag);
                    ctx.lineTo(-24, 0);
                    ctx.lineTo(-28, 12 + tailWag);
                    ctx.closePath();
                    ctx.fill();
                } else if (fish.type === 'corydoras') {
                    ctx.fillStyle = fish.color;
                    ctx.fillRect(-14, -8, 28, 16);
                    ctx.fillStyle = '#65a30d';
                    ctx.fillRect(-10, -4, 20, 8);
                    ctx.beginPath();
                    ctx.moveTo(-14, 0);
                    ctx.lineTo(-22, -7 - tailWag);
                    ctx.lineTo(-22, 7 + tailWag);
                    ctx.closePath();
                    ctx.fill();
                } else if (fish.type === 'neon') {
                    ctx.fillStyle = '#0284c7';
                    ctx.fillRect(-14, -5, 28, 10);
                    ctx.fillStyle = '#38bdf8';
                    ctx.fillRect(-12, -2, 24, 4);
                    ctx.fillStyle = fish.color;
                    ctx.beginPath();
                    ctx.moveTo(-14, 0);
                    ctx.lineTo(-22, -6 - tailWag);
                    ctx.lineTo(-18, 0);
                    ctx.lineTo(-22, 6 + tailWag);
                    ctx.closePath();
                    ctx.fill();
                } else if (fish.type === 'beta') {
                    ctx.fillStyle = fish.color;
                    ctx.fillRect(-12, -7, 24, 14);
                    ctx.beginPath();
                    ctx.moveTo(-12, 0);
                    ctx.lineTo(-26, -14 - tailWag * 1.5);
                    ctx.lineTo(-20, 0);
                    ctx.lineTo(-26, 14 + tailWag * 1.5);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillRect(-4, -15, 12, 8);
                }

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(6, -4, 4, 4);
                ctx.fillStyle = '#000000';
                ctx.fillRect(7, -3, 2, 2);

                if (fish.sizeFactor >= 2.1) {
                    ctx.fillStyle = '#facc15';
                    ctx.fillRect(-4, -18, 8, 4);
                    ctx.fillRect(-2, -22, 4, 4);
                }
            }

            ctx.restore();
        }

        function drawRealisticFish(fish) {
            ctx.save();
            ctx.translate(fish.x, fish.y);
            ctx.rotate(fish.angle);

            const s = fish.sizeFactor;
            const z = fish.zProgress;

            if (fish.tailAnimPhase === undefined) fish.tailAnimPhase = 0;
            const isMoving = Math.abs(fish.vx) > 0.03 || Math.abs(fish.vy) > 0.03;
            if (isMoving) {
                fish.tailAnimPhase += 0.08;
            }
            const tailWag = isMoving ? Math.sin(fish.tailAnimPhase) * 6.5 : 0;

            if (Math.abs(z) > 0.3) {
                const widthScale = Math.max(0.3, 1.0 - Math.abs(z) * 0.7);
                ctx.scale(s * widthScale, s);
                ctx.beginPath();
                ctx.arc(0, 0, 12, 0, Math.PI * 2);
                ctx.fillStyle = fish.color;
                ctx.fill();
                ctx.strokeStyle = '#00000022';
                ctx.stroke();
            } else {
                if (fish.facingLeft) {
                    ctx.scale(-s, s);
                } else {
                    ctx.scale(s, s);
                }

                ctx.fillStyle = fish.color;
                ctx.beginPath();
                if (fish.type === 'beta') {
                    ctx.moveTo(-10, 0);
                    ctx.bezierCurveTo(-25, -18 + tailWag, -35, -22, -30, -5);
                    ctx.bezierCurveTo(-40, 0, -35, 15, -30, 5);
                    ctx.bezierCurveTo(-35, 22, -25, 18 + tailWag, -10, 0);
                } else if (fish.type === 'goldfish') {
                    ctx.moveTo(-12, 0);
                    ctx.quadraticCurveTo(-28, -16 + tailWag, -32, -8);
                    ctx.quadraticCurveTo(-22, 0, -32, 8);
                    ctx.quadraticCurveTo(-28, 16 + tailWag, -12, 0);
                } else {
                    ctx.moveTo(-10, 0);
                    ctx.lineTo(-24, -12 + tailWag);
                    ctx.lineTo(-20, 0);
                    ctx.lineTo(-24, 12 + tailWag);
                }
                ctx.closePath();
                ctx.fill();

                const bodyGrad = ctx.createRadialGradient(-2, -2, 2, 0, 0, 16);
                bodyGrad.addColorStop(0, '#ffffff');
                bodyGrad.addColorStop(0.3, fish.color);
                bodyGrad.addColorStop(1, '#00000044');

                ctx.beginPath();
                ctx.ellipse(0, 0, 16, 9, 0, 0, Math.PI * 2);
                ctx.fillStyle = bodyGrad;
                ctx.fill();
                ctx.lineWidth = 1;
                ctx.strokeStyle = 'rgba(255,255,255,0.4)';
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(-4, -9);
                ctx.quadraticCurveTo(2, -18, 8, -9);
                ctx.fillStyle = fish.color;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(8, -2, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(8.5, -2, 1.2, 0, Math.PI * 2);
                ctx.fillStyle = '#000000';
                ctx.fill();
            }

            ctx.restore();
        }

        function gameLoop() {
            updateFish();
            drawAquarium();
            updateUI();
            renderInventory();
            requestAnimationFrame(gameLoop);
        }

        initGame();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
