<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор Аквариума (HD рыбки без изменения поведения)</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #111827;
            color: #f3f4f6;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: manipulation;
        }
        h1 {
            margin: 10px 0;
            font-size: 1.8rem;
            color: #38bdf8;
            text-shadow: 2px 2px #0369a1;
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 900px;
            max-width: 100%;
            padding: 15px;
            background: #1f2937;
            border: 4px solid #374151;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 8px;
            transition: max-width 0.3s ease;
        }
        
        .container.pc-mode {
            max-width: 1450px !important;
            display: grid;
            grid-template-columns: 310px 864px 310px;
            grid-template-rows: auto auto auto auto auto;
            justify-content: center;
            align-items: start;
            gap: 15px;
        }
        .container.pc-mode h1 {
            grid-column: 1 / -1;
        }
        .container.pc-mode .top-panel {
            grid-column: 1 / -1;
        }
        .container.pc-mode canvas {
            grid-column: 2;
            grid-row: 3;
            width: 864px !important;
            height: 450px !important;
        }
        .container.pc-mode .controls {
            grid-column: 2;
            grid-row: 4;
        }
        .container.pc-mode .panels-box {
            display: contents;
        }
        .container.pc-mode .left-sidebar {
            grid-column: 1;
            grid-row: 3 / span 2;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .container.pc-mode .right-sidebar {
            grid-column: 3;
            grid-row: 3 / span 2;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .container.pc-mode .bottom-full {
            grid-column: 1 / -1;
        }

        .top-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111827;
            padding: 10px 15px;
            border: 2px solid #374151;
            border-radius: 6px;
            font-size: 1.1rem;
            flex-wrap: wrap;
            gap: 10px;
        }
        .stat-group {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .stat-item span {
            color: #facc15;
            font-weight: bold;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            background: #0284c7;
            border: 4px solid #0f172a;
            border-radius: 4px;
            cursor: pointer;
            touch-action: manipulation;
        }

        canvas:fullscreen {
            width: 100vw !important;
            height: 100vh !important;
            aspect-ratio: auto;
            object-fit: contain;
            border: none;
            border-radius: 0;
            background: #020617;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background: #2563eb;
            color: white;
            border: 2px solid #1d4ed8;
            padding: 10px 16px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 4px 0 #1e40af;
            transition: all 0.1s ease;
            touch-action: manipulation;
        }
        button:hover {
            background: #3b82f6;
        }
        button:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1e40af;
        }
        button:disabled {
            background: #374151 !important;
            border-color: #4b5563 !important;
            box-shadow: 0 4px 0 #1f2937 !important;
            color: #9ca3af !important;
            cursor: not-allowed;
            transform: none;
            opacity: 0.65;
        }
        button.success {
            background: #16a34a;
            border-color: #15803d;
            box-shadow: 0 4px 0 #166534;
        }
        button.success:hover {
            background: #22c55e;
        }
        button.warning {
            background: #d97706;
            border-color: #b45309;
            box-shadow: 0 4px 0 #92400e;
        }
        button.warning:hover {
            background: #f59e0b;
        }
        button.purple {
            background: #9333ea;
            border-color: #7e22ce;
            box-shadow: 0 4px 0 #6b21a8;
        }
        button.purple:hover {
            background: #a855f7;
        }
        button.dark-mode {
            background: #475569;
            border-color: #334155;
            box-shadow: 0 4px 0 #1e293b;
        }
        button.dark-mode:hover {
            background: #64748b;
        }
        button.cyan {
            background: #0891b2;
            border-color: #0e7490;
            box-shadow: 0 4px 0 #155e75;
        }
        button.cyan:hover {
            background: #06b6d4;
        }
        .panels-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 768px) {
            .panels-box {
                grid-template-columns: 1fr;
            }
        }
        .panel {
            background: #111827;
            border: 2px solid #374151;
            border-radius: 6px;
            padding: 12px;
        }
        .panel h3 {
            margin-top: 0;
            color: #38bdf8;
            font-size: 1.1rem;
            border-bottom: 2px solid #374151;
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .shop-list, .inventory-list, .quest-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 240px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .shop-item, .inv-item, .quest-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f2937;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #374151;
            font-size: 0.85rem;
        }
        .inv-item-details {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            margin-right: 12px;
        }
        .stats-row {
            display: flex;
            gap: 12px;
            font-size: 0.78rem;
            color: #9ca3af;
            flex-wrap: wrap;
            align-items: center;
        }
        .stat-bar-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
        }

        .bar-container {
            position: relative;
            width: 80px;
            height: 14px;
            background: #0f172a;
            border: 2px solid #d97706;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8), 0 0 2px rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
        }
        .bar-fill-wrapper {
            height: 100%;
            width: 100%;
            position: relative;
            transition: width 0.3s ease;
        }
        .bar-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.45), rgba(255,255,255,0.05));
            pointer-events: none;
        }
        .bar-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 14px,
                rgba(0, 0, 0, 0.4) 14px,
                rgba(0, 0, 0, 0.4) 16px
            );
            z-index: 2;
            pointer-events: none;
        }

        .bar-red {
            background: linear-gradient(to bottom, #f87171 0%, #ef4444 50%, #991b1b 100%);
            box-shadow: 0 0 6px rgba(239, 68, 68, 0.6);
        }
        .bar-green {
            background: linear-gradient(to bottom, #4ade80 0%, #22c55e 50%, #14532d 100%);
            box-shadow: 0 0 6px rgba(34, 197, 94, 0.6);
        }
        .bar-yellow {
            background: linear-gradient(to bottom, #fde047 0%, #eab308 50%, #713f12 100%);
            box-shadow: 0 0 6px rgba(234, 179, 8, 0.6);
        }

        .shop-item button, .inv-item button, .quest-item button {
            padding: 4px 8px;
            font-size: 0.8rem;
            box-shadow: 0 2px 0 #1e40af;
            touch-action: manipulation;
        }
        .bulk-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .bulk-actions button {
            flex: 1;
            font-size: 0.8rem;
            padding: 6px 10px;
        }
        .info-text {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- Фоновый аудиоэлемент -->
    <audio id="aquariumAudio" src="https://github.com/bucketasmr/aquarium/raw/main/Aquarium%20sound.mp3" loop preload="auto"></audio>

    <div class="container" id="mainContainer">
        <h1>Симулятор Аквариума</h1>
        
        <div class="top-panel">
            <div class="stat-group">
                <div class="stat-item">Монеты: <span id="coinsVal">150</span> 🪙</div>
                <div class="stat-item">Рыбки: <span id="fishCountVal">0</span>/<span id="maxFishVal">4</span> 🐠</div>
                <div class="stat-item">Чистота: <span id="cleanVal">100</span>% 💧</div>
            </div>
            <div class="stat-group">
                <div class="stat-item" id="timeOfDayLabel">Время: День ☀️</div>
                <div class="stat-item">Кормление: <span id="feedTimerVal">Готово!</span> ⏳</div>
            </div>
        </div>

        <div class="left-sidebar" id="leftSidebar" style="display: none;">
            <div class="panel">
                <h3>Задания</h3>
                <div class="quest-list" id="questList"></div>
            </div>
        </div>

        <canvas id="aquariumCanvas" width="864" height="450"></canvas>

        <div class="right-sidebar" id="rightSidebar" style="display: none;">
            <div class="panel">
                <h3>Магазин <span style="font-size: 0.95rem; color: #facc15;" id="shopCoinsVal">150 🪙</span></h3>
                <div class="shop-list" id="shopList"></div>
            </div>
        </div>

        <div class="controls">
            <button id="feedBtn" class="success" onclick="feedFish()">Покормить (3 кусочка)</button>
            <button id="cleanBtn" class="warning" onclick="cleanWater()">Почистить воду (20 🪙)</button>
            <button id="fullCleanBtn" class="warning" style="background:#b45309; border-color:#92400e;" onclick="fullCleanWater()">Полная очистка (35 🪙)</button>
            <button id="netBtn" class="cyan" onclick="toggleNetMode()">Сачок: ВЫКЛ</button>
            <button id="filterBtn" onclick="toggleFilter()">Фильтр: ВЫКЛ</button>
            <button id="groundBubblesBtn" class="cyan" onclick="toggleGroundBubbles()">Пузыри грунта: ВКЛ</button>
            <button id="soundBtn" class="success" onclick="toggleAudio()">Звук: ВКЛ 🔊</button>
            <button class="cyan" onclick="toggleCanvasFullScreen()">На весь экран ⛶</button>
            <button class="purple" onclick="setPcMode(true)" id="pcModeBtn">Режим ПК</button>
            <button class="dark-mode" onclick="setPcMode(false)" id="stdModeBtn">Стандартный режим</button>
            <button class="purple" onclick="saveGameManual()">Сохранить</button>
            <button class="purple" onclick="loadGameManual()">Загрузить</button>
        </div>

        <div class="panels-box" id="standardPanels">
            <div class="panel">
                <h3>Задания</h3>
                <div class="quest-list" id="questListMobile"></div>
            </div>
            <div class="panel">
                <h3>Магазин <span style="font-size: 0.95rem; color: #facc15;" id="shopCoinsValMobile">150 🪙</span></h3>
                <div class="shop-list" id="shopListMobile"></div>
            </div>
        </div>

        <div class="panel bottom-full">
            <h3>Список рыб и рынок</h3>
            <div class="bulk-actions">
                <button class="warning" onclick="sellBulkAquariumFish(5)">Продать 5 из аквариума</button>
                <button class="warning" onclick="sellBulkAquariumFish(10)">Продать 10 из аквариума</button>
                <button class="warning" onclick="sellBulkAquariumFish(9999)">Продать всех из акв.</button>
                <button class="success" onclick="sellBulkMarketFish(9999)">Продать всех на рынок</button>
            </div>
            <div class="inventory-list" id="inventoryList"></div>
            <div class="info-text">💀 Если рыбка погибла, включите сачок и нажмите на её трупик на дне, чтобы убрать её!</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('aquariumCanvas');
        const ctx = canvas.getContext('2d');
        const bgAudio = document.getElementById('aquariumAudio');

        const SAVE_KEY = 'pixel_aquarium_save_master_v14';

        let gameData = {
            coins: 150,
            maxFishCapacity: 4,
            waterCleanliness: 100,
            filterOn: false,
            groundBubblesOn: true, // Включение/выключение случайных пузырей грунта
            lightOn: false,
            pcMode: false,
            showFishBars: true,
            netMode: false,
            soundOn: true,
            lastFeedTime: 0,
            fishes: [],
            decorations: [],
            inventory: [],
            foods: [],
            poops: [],
            fishBubbles: [],
            groundBubbles: [],
            sandDusts: [],
            matingParticles: [],
            treasures: [],
            activeNet: null,
            chestTimer: 0,
            quests: {
                poopCollected: 0,
                bubblesPopped: 0,
                treasuresCollected: 0,
                coinsEarnedGoal: 0
            }
        };

        let mouseX = -9999;
        let mouseY = -9999;
        let wasDarkLastFrame = false;

        const SHOP_ITEMS = [
            { id: 'guppy', name: 'Гуппи (Быстрые стайные)', type: 'fish', price: 25, color: '#eab308', accentColor: '#f97316', adultTimeDays: 1, nocturnal: false, icon: '🐠' },
            { id: 'goldfish', name: 'Малек Золотой рыбки (Крупная)', type: 'fish', price: 50, color: '#f97316', accentColor: '#fbbf24', adultTimeDays: 7, nocturnal: false, icon: '🐠' },
            { id: 'neon', name: 'Малек Неона (Яркий косяк)', type: 'fish', price: 30, color: '#06b6d4', accentColor: '#3b82f6', adultTimeDays: 7, nocturnal: false, icon: '🐠' },
            { id: 'corydoras', name: 'Сомик Коридорас (Ночной санитар)', type: 'fish', price: 45, color: '#a3e635', accentColor: '#65a30d', adultTimeDays: 5, nocturnal: true, icon: '🐠' },
            { id: 'beta', name: 'Малек Петушка (Элегантный)', type: 'fish', price: 80, color: '#ec4899', accentColor: '#9333ea', adultTimeDays: 7, nocturnal: false, icon: '🐠' },
            { id: 'expand', name: 'Расширение аквариума (+2 места)', type: 'upgrade', price: 80, icon: '📐' },
            { id: 'castle', name: 'Замок', type: 'decor', price: 150, icon: '🏰' },
            { id: 'plant', name: 'Водоросли', type: 'decor', price: 40, icon: '🌿' }
        ];

        function initGame() {
            loadGameData();

            if (!gameData.fishes || gameData.fishes.length === 0) {
                gameData.fishes.push(createFish('guppy', '#eab308', '#f97316', 1, false));
                gameData.fishes.push(createFish('corydoras', '#a3e635', '#65a30d', 5, true));
            }

            gameData.decorations = (gameData.decorations || []).filter(d => d.type !== 'chest');
            gameData.decorations.push({ type: 'chest', x: 720, y: 410 });

            if (!gameData.decorations.some(d => d.type === 'plant')) {
                gameData.decorations.push({ type: 'plant', x: 80, y: 410, scaleY: 1.0 });
                gameData.decorations.push({ type: 'plant', x: 220, y: 410, scaleY: 1.0 });
            }

            gameData.decorations.forEach(d => {
                if (d.type === 'plant' && d.scaleY === undefined) d.scaleY = 1.0;
            });

            applyPcModeUI();
            updateNetButtonUI();
            updateSoundButtonUI();
            updateGroundBubblesButtonUI();
            
            if (gameData.soundOn) {
                bgAudio.play().catch(() => {
                    const unlockAudio = () => {
                        bgAudio.play();
                        window.removeEventListener('pointerdown', unlockAudio);
                    };
                    window.addEventListener('pointerdown', unlockAudio);
                });
            }

            renderShop();
            renderInventory();
            renderQuests();
            updateUI();

            canvas.addEventListener('pointerdown', handleCanvasClick);
            canvas.addEventListener('pointermove', handlePointerMove);
            canvas.addEventListener('pointerleave', () => { mouseX = -9999; mouseY = -9999; });
        }

        function saveGame() {
            localStorage.setItem(SAVE_KEY, JSON.stringify(gameData));
        }

        function loadGameData() {
            let saved = localStorage.getItem(SAVE_KEY);

            if (!saved) {
                for (let i = 13; i >= 1; i--) {
                    const oldSave = localStorage.getItem(`pixel_aquarium_save_v${i}`) || localStorage.getItem('pixel_aquarium_save_master');
                    if (oldSave) {
                        saved = oldSave;
                        break;
                    }
                }
            }

            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    gameData = { ...gameData, ...parsed };
                    if (!gameData.foods) gameData.foods = [];
                    if (!gameData.matingParticles) gameData.matingParticles = [];
                    if (!gameData.fishes) gameData.fishes = [];
                    if (!gameData.inventory) gameData.inventory = [];
                    if (!gameData.groundBubbles) gameData.groundBubbles = [];
                    
                    if (gameData.groundBubblesOn === undefined) gameData.groundBubblesOn = true;

                    if (!gameData.quests || typeof gameData.quests !== 'object') {
                        gameData.quests = {};
                    }
                    if (typeof gameData.quests.poopCollected !== 'number' || isNaN(gameData.quests.poopCollected)) {
                        gameData.quests.poopCollected = 0;
                    }
                    if (typeof gameData.quests.bubblesPopped !== 'number' || isNaN(gameData.quests.bubblesPopped)) {
                        gameData.quests.bubblesPopped = 0;
                    }
                    if (typeof gameData.quests.treasuresCollected !== 'number' || isNaN(gameData.quests.treasuresCollected)) {
                        gameData.quests.treasuresCollected = 0;
                    }
                    if (typeof gameData.quests.coinsEarnedGoal !== 'number' || isNaN(gameData.quests.coinsEarnedGoal)) {
                        gameData.quests.coinsEarnedGoal = 0;
                    }

                    if (gameData.showFishBars === undefined) gameData.showFishBars = true;
                    if (gameData.netMode === undefined) gameData.netMode = false;
                    if (gameData.soundOn === undefined) gameData.soundOn = true;
                    
                    gameData.fishes.forEach(f => {
                        if (f.tailAnimPhase === undefined) f.tailAnimPhase = Math.random() * Math.PI * 2;
                        if (f.health === undefined) f.health = Math.floor(Math.random() * 21) + 80;
                        if (f.fullness === undefined) f.fullness = 50;
                        if (f.happiness === undefined) f.happiness = 100;
                        if (f.nocturnal === undefined) f.nocturnal = f.type === 'corydoras';
                        if (f.zProgress === undefined) f.zProgress = 0;
                        if (f.isDead === undefined) f.isDead = false;
                        if (f.decompositionTimer === undefined) f.decompositionTimer = 0;
                        if (f.accentColor === undefined) f.accentColor = f.color;
                    });
                    saveGame();
                } catch (e) {
                    console.error('Ошибка загрузки сохранения', e);
                }
            }
        }

        function toggleAudio() {
            gameData.soundOn = !gameData.soundOn;
            if (gameData.soundOn) {
                bgAudio.play();
            } else {
                bgAudio.pause();
            }
            updateSoundButtonUI();
            saveGame();
        }

        function updateSoundButtonUI() {
            const btn = document.getElementById('soundBtn');
            if (gameData.soundOn) {
                btn.innerText = 'Звук: ВКЛ 🔊';
                btn.className = 'success';
            } else {
                btn.innerText = 'Звук: ВЫКЛ 🔇';
                btn.className = 'dark-mode';
            }
        }

        function toggleGroundBubbles() {
            gameData.groundBubblesOn = !gameData.groundBubblesOn;
            if (!gameData.groundBubblesOn) {
                gameData.groundBubbles = []; // Очистить текущие пузыри при выключении
            }
            updateGroundBubblesButtonUI();
            saveGame();
        }

        function updateGroundBubblesButtonUI() {
            const btn = document.getElementById('groundBubblesBtn');
            if (gameData.groundBubblesOn) {
                btn.innerText = 'Пузыри грунта: ВКЛ';
                btn.className = 'cyan';
            } else {
                btn.innerText = 'Пузыри грунта: ВЫКЛ';
                btn.className = 'dark-mode';
            }
        }

        function setPcMode(enabled) {
            gameData.pcMode = enabled;
            applyPcModeUI();
            saveGame();
        }

        function toggleNetMode() {
            gameData.netMode = !gameData.netMode;
            updateNetButtonUI();
            saveGame();
        }

        function updateNetButtonUI() {
            const btn = document.getElementById('netBtn');
            if (gameData.netMode) {
                btn.innerText = 'Сачок: ВКЛ 🥅';
                btn.style.background = '#16a34a';
                btn.style.borderColor = '#15803d';
            } else {
                btn.innerText = 'Сачок: ВЫКЛ';
                btn.style.background = '#0891b2';
                btn.style.borderColor = '#0e7490';
            }
        }

        function toggleCanvasFullScreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement) {
                if (canvas.requestFullscreen) {
                    canvas.requestFullscreen();
                } else if (canvas.webkitRequestFullscreen) {
                    canvas.webkitRequestFullscreen();
                } else if (canvas.mozRequestFullScreen) {
                    canvas.mozRequestFullScreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                }
            }
        }

        function applyPcModeUI() {
            const container = document.getElementById('mainContainer');
            const pcBtn = document.getElementById('pcModeBtn');
            const stdBtn = document.getElementById('stdModeBtn');
            const standardPanels = document.getElementById('standardPanels');
            const leftSidebar = document.getElementById('leftSidebar');
            const rightSidebar = document.getElementById('rightSidebar');

            if (gameData.pcMode) {
                container.classList.add('pc-mode');
                pcBtn.style.background = '#16a34a';
                pcBtn.style.borderColor = '#15803d';
                stdBtn.style.background = '#475569';
                stdBtn.style.borderColor = '#334155';

        function saveGameManual() {
            saveGame();
            alert('Игра успешно сохранена!');
        }

        function loadGameManual() {
            loadGameData();
            updateNetButtonUI();
            updateSoundButtonUI();
            updateGroundBubblesButtonUI();
            if (gameData.soundOn) bgAudio.play();
            else bgAudio.pause();
            renderShop();
            renderInventory();
            renderQuests();
            updateUI();
            alert('Игра успешно загружена!');

        function createFish(type, color, accentColor, adultDays = 7, nocturnal = false) {
            const minMs = 5 * 60 * 1000;
            const maxMs = 15 * 60 * 1000;
            const randomPoopInterval = Math.floor(Math.random() * (maxMs - minMs + 1)) + minMs;

            let preferredY = 200;
            if (type === 'neon' || type === 'guppy') preferredY = 80 + Math.random() * 150;
            if (type === 'goldfish') preferredY = 180 + Math.random() * 160;
            if (type === 'corydoras') preferredY = 360 + Math.random() * 30;
            if (type === 'beta') preferredY = 120 + Math.random() * 200;

            return {
                id: Math.random().toString(36).substr(2, 9),
                type: type,
                color: color,
                accentColor: accentColor,
                nocturnal: nocturnal,
                x: Math.random() * (canvas.width - 120) + 60,
                y: preferredY,
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.2,
                targetX: Math.random() * (canvas.width - 120) + 60,
                targetY: preferredY,
                angle: 0,
                facingLeft: false,
                zProgress: 0, 
                state: 'swim',
                stateTimer: Math.floor(Math.random() * 240) + 240,
                inspectPauseTimer: 0,
                scaredTimer: 0,
                birthTime: Date.now(),
                adultDays: adultDays,
                sizeFactor: 1.0,
                lastPoopTime: Date.now(),
                nextPoopInterval: randomPoopInterval,
                tailAnimPhase: Math.random() * Math.PI * 2,
                health: Math.floor(Math.random() * 21) + 80,
                fullness: 50,
                happiness: 100,
                isDead: false,
                decompositionTimer: 0
            };
        }

        function getCanvasCoordinates(event) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            let clientX = event.clientX;
            let clientY = event.clientY;

            if (event.touches && event.touches.length > 0) {
                clientX = event.touches[0].clientX;
                clientY = event.touches[0].clientY;
            }

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function handlePointerMove(event) {
            const coords = getCanvasCoordinates(event);
            mouseX = coords.x;
            mouseY = coords.y;
        }

        function triggerNightLightPanic() {
            gameData.fishes.forEach(fish => {
                if (!fish.isDead && !fish.nocturnal) {
                    fish.scaredTimer = 180;
                    fish.state = 'dash';
                    fish.targetX = Math.random() * (canvas.width - 120) + 60;
                    fish.targetY = Math.random() * 250 + 60;
                }
            });
        }

        function handleCanvasClick(event) {
            const coords = getCanvasCoordinates(event);
            const clickX = coords.x;
            const clickY = coords.y;

            if (clickX >= 10 && clickX <= 180 && clickY >= 5 && clickY <= 30) {
                gameData.showFishBars = !gameData.showFishBars;
                saveGame();
                updateUI();
                return;
            }

            if (clickX >= canvas.width / 2 - 60 && clickX <= canvas.width / 2 + 60 && clickY >= 0 && clickY <= 35) {
                const timeData = getTimeOfDay();
                const wasDark = timeData.dark && !gameData.lightOn;
                
                gameData.lightOn = !gameData.lightOn;

                if (wasDark && gameData.lightOn) {
                    triggerNightLightPanic();
                }

                saveGame();
                updateUI();
                return;
            }

            if (clickX >= 770 && clickX <= 815 && clickY >= 335 && clickY <= 410) {
                toggleFilter();
                return;
            }

            if (gameData.netMode && !gameData.activeNet) {
                const clickedDeadFish = gameData.fishes.find(fish => fish.isDead && Math.hypot(fish.x - clickX, fish.y - clickY) < 30);
                if (clickedDeadFish) {
                    gameData.activeNet = {
                        x: clickedDeadFish.x,
                        targetY: clickedDeadFish.y,
                        currentY: 20,
                        fishId: clickedDeadFish.id,
                        state: 'down'
                    };
                    return;
                }
            }

            let collected = false;

            gameData.treasures = gameData.treasures.filter(t => {
                const dist = Math.hypot(t.x - clickX, t.y - clickY);
                if (dist < 22) {
                    gameData.coins += 15;
                    gameData.quests.treasuresCollected = (gameData.quests.treasuresCollected || 0) + 1;
                    gameData.quests.coinsEarnedGoal = (gameData.quests.coinsEarnedGoal || 0) + 15;
                    collected = true;
                    renderQuests();
                    return false;
                }
                return true;
            });

            gameData.poops = gameData.poops.filter(p => {
                const dist = Math.hypot(p.x - clickX, p.y - clickY);
                if (dist < 22) {
                    gameData.coins += 3;
                    gameData.quests.poopCollected = (gameData.quests.poopCollected || 0) + 1;
                    gameData.quests.coinsEarnedGoal = (gameData.quests.coinsEarnedGoal || 0) + 3;
                    collected = true;
                    renderQuests();
                    return false;
                }
                return true;
            });

            gameData.fishBubbles = gameData.fishBubbles.filter(b => {
                const dist = Math.hypot(b.x - clickX, b.y - clickY);
                if (dist < 22) {
                    gameData.coins += 1;
                    gameData.quests.bubblesPopped = (gameData.quests.bubblesPopped || 0) + 1;
                    gameData.quests.coinsEarnedGoal = (gameData.quests.coinsEarnedGoal || 0) + 1;
                    collected = true;
                    renderQuests();
                    return false;
                }
                return true;
            });

            if (collected) {
                saveGame();
                updateUI();
                renderShop();
                return;
            }

            spawnMultipleFood(clickX, clickY, 3);
            triggerScare(clickX, clickY, 180);
        }

        function spawnFood(x, y) {
            gameData.foods.push({
                x: x,
                y: y,
                targetY: 410,
                falling: true,
                spawnTime: Date.now()
            });
            saveGame();
            updateUI();
        }

        function spawnMultipleFood(x, y, count = 3) {
            for (let i = 0; i < count; i++) {
                const offsetX = (Math.random() - 0.5) * 35;
                const offsetY = (Math.random() - 0.5) * 15;
                gameData.foods.push({
                    x: Math.max(30, Math.min(canvas.width - 30, x + offsetX)),
                    y: Math.max(20, Math.min(200, y + offsetY)),
                    targetY: 410,
                    falling: true,
                    spawnTime: Date.now()
                });
            }
            saveGame();
            updateUI();
        }

        function triggerScare(x, y, radius) {
            gameData.fishes.forEach(fish => {
                if (!fish.isDead) {
                    const dist = Math.hypot(fish.x - x, fish.y - y);
                    if (dist < radius) {
                        const angle = Math.atan2(fish.y - y, fish.x - x);
                        const escapeDist = 200 + Math.random() * 100;
                        
                        fish.targetX = Math.max(60, Math.min(canvas.width - 60, fish.x + Math.cos(angle) * escapeDist));
                        fish.targetY = Math.max(50, Math.min(380, fish.y + Math.sin(angle) * escapeDist));
                        
                        fish.state = 'dash';
                        fish.inspectPauseTimer = 0;
                        fish.scaredTimer = 80;
                        fish.stateTimer = 240;
                    }
                }
            });
        }

        const FEED_INTERVAL = 12 * 60 * 60 * 1000;

        function feedFish() {
            const now = Date.now();
            const elapsed = now - gameData.lastFeedTime;
            if (gameData.lastFeedTime > 0 && elapsed < FEED_INTERVAL) return;

            gameData.lastFeedTime = now;
            feedFishRandom();
            gameData.waterCleanliness = Math.max(0, gameData.waterCleanliness - 5);
            saveGame();
            updateUI();
        }

        function feedFishRandom() {
            spawnMultipleFood(Math.random() * (canvas.width - 100) + 50, 40 + Math.random() * 50, 3);
        }

        function cleanWater() {
            if (gameData.coins < 20) {
                alert('Недостаточно монет!');
                return;
            }
            gameData.coins -= 20;
            gameData.waterCleanliness = 100;
            saveGame();
            updateUI();
            renderShop();

        function fullCleanWater() {
            if (gameData.coins < 35) {
                alert('Недостаточно монет! Требуется 35 🪙');
                return;
            }
            gameData.coins -= 35;
            gameData.waterCleanliness = 100;
            gameData.poops = [];
            gameData.foods = [];
            saveGame();
            updateUI();
            renderShop();

        function toggleFilter() {
            gameData.filterOn = !gameData.filterOn;
            saveGame();
            updateUI();
        }

        function buyItem(itemId) {
            const item = SHOP_ITEMS.find(i => i.id === itemId);
            if (!item || gameData.coins < item.price) {
                alert('Недостаточно монет!');
                return;
            }

            if (item.type === 'fish') {
                if (gameData.fishes.length >= gameData.maxFishCapacity) {
                    alert('Аквариум полон! Купите расширение в магазине.');
                    return;
                }
                gameData.coins -= item.price;
                gameData.fishes.push(createFish(item.id, item.color, item.accentColor, item.adultTimeDays || 7, item.nocturnal || false));
            } else if (item.type === 'upgrade') {
                gameData.coins -= item.price;
                gameData.maxFishCapacity += 2;
            } else if (item.type === 'decor') {
                gameData.coins -= item.price;
                gameData.decorations.push({
                    type: item.id,
                    x: Math.random() * (canvas.width - 160) + 80,
                    y: 410,
                    scaleY: item.id === 'plant' ? 1.0 : undefined
                });
            }

            saveGame();
            renderInventory();
            renderShop();
            updateUI();
        }

        function sellFishFromAquarium(fishId) {
            const index = gameData.fishes.findIndex(f => f.id === fishId);
            if (index !== -1) {
                const fish = gameData.fishes[index];
                if (fish.isDead) return;
                const ageDays = (Date.now() - fish.birthTime) / (1000 * 60 * 60 * 24);
                const adultDays = fish.adultDays || 7;
                const percent = Math.min(1, ageDays / adultDays);

                let maxReward = 60;
                if (fish.type === 'guppy') maxReward = 35;
                if (fish.type === 'beta') maxReward = 100;
                if (fish.type === 'neon') maxReward = 40;
                if (fish.type === 'corydoras') maxReward = 55;

                const healthFactor = (fish.health || 100) / 100;
                const reward = Math.max(5, Math.round(maxReward * 0.7 * percent * healthFactor));

                gameData.coins += reward;
                gameData.quests.coinsEarnedGoal = (gameData.quests.coinsEarnedGoal || 0) + reward;
                gameData.fishes.splice(index, 1);
                saveGame();
                renderInventory();
                renderShop();
                updateUI();
            }
        }

        function sellFish(invId) {
            const index = gameData.inventory.findIndex(f => f.id === invId);
            if (index !== -1) {
                const fish = gameData.inventory[index];
                let reward = 60;
                if (fish.type === 'guppy') reward = 35;
                if (fish.type === 'beta') reward = 100;
                if (fish.type === 'neon') reward = 40;
                if (fish.type === 'corydoras') reward = 55;

                gameData.coins += reward;
                gameData.quests.coinsEarnedGoal = (gameData.quests.coinsEarnedGoal || 0) + reward;
                gameData.inventory.splice(index, 1);
            }
            saveGame();
            renderInventory();
            renderShop();
            updateUI();
        }

        function sellBulkAquariumFish(count) {
            if (gameData.fishes.length === 0) {
                alert('В аквариуме нет рыб!');
                return;
            }

            let soldCount = 0;
            gameData.fishes = gameData.fishes.filter(fish => {
                if (fish.isDead) return true;
                if (soldCount < count) {
                    const ageDays = (Date.now() - fish.birthTime) / (1000 * 60 * 60 * 24);
                    const adultDays = fish.adultDays || 7;
                    const percent = Math.min(1, ageDays / adultDays);

                    let maxReward = 60;
                    if (fish.type === 'guppy') maxReward = 35;
                    if (fish.type === 'beta') maxReward = 100;
                    if (fish.type === 'neon') maxReward = 40;
                    if (fish.type === 'corydoras') maxReward = 55;

                    const healthFactor = (fish.health || 100) / 100;
                    const reward = Math.max(5, Math.round(maxReward * 0.7 * percent * healthFactor));
                    gameData.coins += reward;
                    gameData.quests.coinsEarnedGoal = (gameData.quests.coinsEarnedGoal || 0) + reward;
                    soldCount++;
                    return false;
                }
                return true;
            });

            saveGame();
            renderInventory();
            renderShop();
            updateUI();
        }

        function sellBulkMarketFish(count) {
            if (gameData.inventory.length === 0) {
                alert('Нет готовых рыб на рынок!');
                return;
            }

            let soldCount = 0;
            while (gameData.inventory.length > 0 && soldCount < count) {
                const fish = gameData.inventory.pop();
                let reward = 60;
                if (fish.type === 'guppy') reward = 35;
                if (fish.type === 'beta') reward = 100;
                if (fish.type === 'neon') reward = 40;
                if (fish.type === 'corydoras') reward = 55;

                gameData.coins += reward;
                gameData.quests.coinsEarnedGoal = (gameData.quests.coinsEarnedGoal || 0) + reward;
                soldCount++;
            }

            saveGame();
            renderInventory();
            renderShop();
            updateUI();
        }

        function claimQuest(questType, reward) {
            gameData.coins += reward;
            if (questType === 'poop') gameData.quests.poopCollected = Math.max(0, (gameData.quests.poopCollected || 0) - 10);
            if (questType === 'bubbles') gameData.quests.bubblesPopped = Math.max(0, (gameData.quests.bubblesPopped || 0) - 15);
            if (questType === 'treasures') gameData.quests.treasuresCollected = Math.max(0, (gameData.quests.treasuresCollected || 0) - 3);
            if (questType === 'coins') gameData.quests.coinsEarnedGoal = Math.max(0, (gameData.quests.coinsEarnedGoal || 0) - 100);
            saveGame();
            updateUI();
            renderQuests();
            renderShop();
        }

        function renderQuests() {
            const qList = document.getElementById('questList');
            const qListMob = document.getElementById('questListMobile');
            
            const pColl = gameData.quests.poopCollected || 0;
            const bPoop = gameData.quests.bubblesPopped || 0;
            const tColl = gameData.quests.treasuresCollected || 0;
            const cGoal = gameData.quests.coinsEarnedGoal || 0;

            const poopDone = pColl >= 10;
            const bubblesDone = bPoop >= 15;
            const treasuresDone = tColl >= 3;
            const coinsDone = cGoal >= 100;

            const questsUI = [
                { id: 'treasures', text: `Собрать 3 сокровища (${Math.min(3, tColl)}/3)`, done: treasuresDone, reward: 35 },
                { id: 'poop', text: `Убрать 10 какашек (${Math.min(10, pColl)}/10)`, done: poopDone, reward: 30 },
                { id: 'bubbles', text: `Лопнуть 15 пузырей (${Math.min(15, bPoop)}/15)`, done: bubblesDone, reward: 25 },
                { id: 'coins', text: `Заработать 100 монет (${Math.min(100, cGoal)}/100)`, done: coinsDone, reward: 40 }
            ];

            const renderHtml = questsUI.map(q => `
                <div class="quest-item">
                    <span>${q.text} — ${q.reward} 🪙</span>
                    <button class="success" ${!q.done ? 'disabled' : ''} onclick="claimQuest('${q.id}', ${q.reward})">
                        Забрать
                    </button>
                </div>
            `).join('');

            if (qList) qList.innerHTML = renderHtml;
            if (qListMob) qListMob.innerHTML = renderHtml;
        }

        function renderShop() {
            const shopList = document.getElementById('shopList');
            const shopListMob = document.getElementById('shopListMobile');
            
            let html = '';
            SHOP_ITEMS.forEach(item => {
                const canAfford = gameData.coins >= item.price;
                html += `
                    <div class="shop-item">
                        <span>${item.icon} ${item.name} (${item.price} 🪙)</span>
                        <button ${!canAfford ? 'disabled' : ''} onclick="buyItem('${item.id}')">Купить</button>
                    </div>
                `;
            });

            if (shopList) shopList.innerHTML = html;
            if (shopListMob) shopListMob.innerHTML = html;
        }
